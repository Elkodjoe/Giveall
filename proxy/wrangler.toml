name = "giveall-appreciation-proxy"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Set the following as SECRETS (not [vars]) before the first deploy:
#   npx wrangler secret put ANTHROPIC_API_KEY   # and/or OPENAI_API_KEY (at least one) — text route
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put ELEVENLABS_API_KEY  # optional — enables the /speak route
#   npx wrangler secret put APP_TOKEN           # optional; if set, callers must send x-app-token (or ?t=)
#
# Non-secret config (uncomment and edit as needed):
# [vars]
# ELEVENLABS_VOICE_ID = "21m00Tcm4TlvDq8ikWAM"
# ALLOWED_ORIGINS = "https://giveall-love.web.app,https://giveall-dashboard.web.app"
